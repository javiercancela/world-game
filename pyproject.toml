[project]
name = "world-game"
version = "0.1.0"
description = "An event-sourced conversation RPG using a bounded Fate Condensed profile"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["pydantic>=2,<3", "typer>=0.12,<1", "rich>=13,<15", "openai>=2,<3"]

[project.scripts]
world-game = "world_game.cli:app"

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.9", "mypy>=1.14", "build>=1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/world_game"]

[tool.hatch.build.targets.wheel.force-include]
"licenses" = "world_game/licenses"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: opt-in network evaluation (excluded by default)"]
addopts = "-m 'not live'"
